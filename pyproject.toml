[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "job-matcher"
version = "0.1.0"
description = "Personal job matcher CLI — hiring.cafe + LangGraph + DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
job-matcher = "job_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["job_matcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
