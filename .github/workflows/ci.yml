name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run pytest
        run: uv run python -m pytest tests/ -q --tb=short
        env:
          DEEPSEEK_API_KEY: sk-ci-placeholder
          MONGODB_URI: ""

  evals:
    name: Evals (Layer 1 + Layer 2)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Layer 1 — extraction accuracy
        run: uv run python evals/run_extraction_eval.py
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: job-matcher-ci
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MONGODB_URI: mongodb://localhost:27017

      - name: Layer 2 — ranking quality
        run: uv run python evals/run_ranking_eval.py
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: job-matcher-ci
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MONGODB_URI: mongodb://localhost:27017

  frontend:
    name: Frontend (tsc + Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: web

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=line
        working-directory: web
